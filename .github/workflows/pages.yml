# Publishes the overview page to GitHub Pages as plain static files (no Jekyll build).
# efforts.js is committed, not generated here: extract_efforts.py needs the local clones of all app repositories.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          # Whole repository; dotfiles (.vscode, .gitignore, …) are left out by default.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
